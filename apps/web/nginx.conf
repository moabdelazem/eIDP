# The single-page app: files as they are, every other path to index.html so a
# deep link (/jenkins/build?job=…) loads the app and React Router takes it.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Hashed names: a new build is new files, so these never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # For the probes; says nothing but that nginx answers.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # index.html is what points at this build's assets: never cached, so a
  # deploy reaches open tabs (app/lazy-page.ts reloads them onto it).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
  }
}
