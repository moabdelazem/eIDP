{{- if .Values.api.secrets.generateJwtSecret }}
{{- $name := printf "%s-generated" (include "eidp.api.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "eidp.labels" (dict "root" . "component" "api") | nindent 4 }}
  annotations:
    # Kept on uninstall: a new secret would sign everyone out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ include "eidp.keptRandom" (dict "root" . "secret" $name "key" "JWT_SECRET" "length" 48) }}
{{- end }}
