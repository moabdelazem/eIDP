apiVersion: v1
kind: Service
metadata:
  name: {{ include "eidp.api.fullname" . }}
  labels:
    {{- include "eidp.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
      appProtocol: http
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "eidp.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
