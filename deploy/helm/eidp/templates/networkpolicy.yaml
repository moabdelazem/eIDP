{{- if .Values.networkPolicy.enabled }}
{{- $gateway := .Values.networkPolicy.gatewayNamespace }}
{{- range $component := list "web" "api" }}
---
# Only the Gateway reaches the {{ $component }}{{ if eq $component "api" }} (and the chart's own test pod){{ end }}. Egress is open: the API talks to the directory, Azure DevOps, Jira, Jenkins, Vault and Ollama, wherever they are.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eidp.fullname" $ | trunc 59 | trimSuffix "-" }}-{{ $component }}
  labels:
    {{- include "eidp.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eidp.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gateway }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: test
      ports:
        - port: http
    {{- if and (eq $component "api") $.Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.metricsNamespace }}
      ports:
        - port: metrics
    {{- end }}
{{- end }}
{{- if $.Values.postgresql.enabled }}
---
# The chart's Postgres answers the API alone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eidp.postgres.fullname" $ }}
  labels:
    {{- include "eidp.labels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "eidp.selectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "eidp.selectorLabels" (dict "root" $ "component" "api") | nindent 14 }}
      ports:
        - port: postgres
{{- end }}
{{- end }}
