{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eidp.serviceAccountName" . }}
  labels:
    {{- include "eidp.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
