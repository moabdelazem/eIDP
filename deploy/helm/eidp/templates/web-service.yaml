apiVersion: v1
kind: Service
metadata:
  name: {{ include "eidp.web.fullname" . }}
  labels:
    {{- include "eidp.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "eidp.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
