{{- $web := .Values.web }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eidp.web.fullname" . }}
  labels:
    {{- include "eidp.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ $web.replicaCount }}
  selector:
    matchLabels:
      {{- include "eidp.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "eidp.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        {{- with $web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # The nginx-unprivileged image's user.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "eidp.image" (dict "root" . "image" $web.image) }}
          imagePullPolicy: {{ $web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml $web.resources | nindent 12 }}
          securityContext:
            {{- include "eidp.containerSecurityContext" . | nindent 12 }}
          # nginx writes its pid and temp files; the rest of the root stays read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- with $web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
