{{- with .Values.httpRoute }}
{{- if .enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "eidp.fullname" $ }}
  labels:
    {{- include "eidp.labels" (dict "root" $ "component" "web") | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .parentRefs | nindent 4 }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Streaming paths first, so their longer match carries its own timeout. */}}
    {{- range .streamingPaths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ trimPrefix "/api" . | default "/" }}
      backendRefs:
        - name: {{ include "eidp.api.fullname" $ }}
          port: 3000
      timeouts:
        request: {{ $.Values.httpRoute.timeouts.streaming }}
    {{- end }}
    # The API's routes are at its root; /api is the web app's name for it.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "eidp.api.fullname" $ }}
          port: 3000
      timeouts:
        request: {{ .timeouts.api }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "eidp.web.fullname" $ }}
          port: 80
{{- end }}
{{- end }}
