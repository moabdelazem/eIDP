services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eidp
      POSTGRES_PASSWORD: eidp
      POSTGRES_DB: eidp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidp"]
      interval: 5s
      retries: 10

  openldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: eIDP
      LDAP_DOMAIN: eidp.local
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "389:389"
    volumes:
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
      - ldapdata:/var/lib/ldap
      - ldapconfig:/etc/ldap/slapd.d

volumes:
  postgres-data:
  ldapdata:
  ldapconfig:
